  <h1>Array</h1>

  <!-- Örnek -->
  <div class="editor-block" data-editor>
    <h2>Liste Yazımı</h2>
    <div class="editor-panels">
      <div class="panel">
        <div class="label">HTML</div>
        <textarea class="htmlCode">
<!DOCTYPE html>
  <html lang="tr">
    <head>
      <title>Document</title>
    </head>
    <body></body>
  </html></textarea>
      </div>
      <div class="panel hide">
        <div class="label">CSS</div>
        <textarea class="cssCode"></textarea>
      </div>
      <div class="panel">
        <div class="label">JavaScript</div>
        <textarea class="jsCode">
var emptyArray = [];
var numbers = [1,2,3,4,5];
var fruits = ["apple","banana","cherry"];

console.log(emptyArray);
console.log(numbers);
console.log(fruits);

document.write(emptyArray);
document.write("<br>");
document.write(numbers);
document.write("<br>");
document.write(fruits);
document.write("<br>");
document.write("<hr>");

var emptyArray = new Array();
var numbers = new Array(1,2,3,4,5);
var fruits = new Array("apple","banana","cherry");

console.log(emptyArray);
console.log(numbers);
console.log(fruits);

document.write(emptyArray);
document.write("<br>");
document.write(numbers);
document.write("<br>");
document.write(fruits);</textarea>
      </div>
    </div>
    <div class="button-bar">
      <button class="run-btn">Çalıştır</button>
    </div>
    <iframe class="output"></iframe>
  </div>
